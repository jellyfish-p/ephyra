services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ephyra
      POSTGRES_PASSWORD: ephyra
      POSTGRES_DB: ephyra
    ports:
      - "5432:5432"
    volumes:
      - ephyra-pg:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ephyra
      MINIO_ROOT_PASSWORD: ephyra-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ephyra-minio:/data

volumes:
  ephyra-pg:
  ephyra-minio:
