name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ephyra
          POSTGRES_PASSWORD: ephyra
          POSTGRES_DB: ephyra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ephyra -d ephyra_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      EPHYRA_TEST_DATABASE_URL: postgres://ephyra:ephyra@localhost:5432/ephyra_test?sslmode=disable
      EPHYRA_TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: |
            go.work.sum
            server/go.sum
            protocol/go.sum
      - name: test
        working-directory: server
        run: go test -race -count=1 -timeout 5m ./...
